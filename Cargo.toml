[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/relay-bridge", "crates/relay-webkit", "crates/relay-extensions", "crates/relay-mcp", "crates/relay-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
relay-bridge = { path = "crates/relay-bridge" }
relay-webkit = { path = "crates/relay-webkit" }
relay-extensions = { path = "crates/relay-extensions" }
relay-mcp = { path = "crates/relay-mcp" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v5"] }
plist = "1"
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time"] }
rmcp = { version = "3.11", features = ["server", "client", "transport-io", "macros"] }
schemars = "1"
rusqlite = "0.43"
zip = { version = "9", default-features = false, features = ["deflate"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
gpui = "0.2.2"
zeroize = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
debug = 0

[profile.dev.package."*"]
# Dependencies compile at 0: debug builds are for tests and contributors, and
# opt-level 1 roughly doubles cold CI time on the two-core runner. Release
# builds are what users run.
opt-level = 0

[patch.crates-io]
# See third_party/README.md.
xattr = { path = "third_party/xattr" }
