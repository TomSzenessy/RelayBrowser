name: ci

on:
  # Pull requests and the merge queue run the full path; pushes only on the
  # default branch, so a pull request's commits are not verified twice.
  push:
    branches: [main]
  pull_request:
    # `gh pr ready` must start the first non-draft run (#152).
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only superseded pull request runs are cancelled; main verifications finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # A draft PR is still being edited: it must not spend CI minutes.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: repository verification (python ${{ matrix.python }})
    runs-on: [self-hosted, linux, arm64]
    permissions:
      contents: read
      actions: read  # gh run list/view for tree-hash reuse
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor; 3.x is the latest stable release.
        python: ["3.11", "3.x"]
    steps:
      - name: Check out pinned revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history lets make verify detect stale documents (docs/self-healing.md).
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install the pinned Rust toolchain
        # The self-hosted runner is a general Linux box: Rust and Node are not
        # part of its image, so install them before any surface check.
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.100.0
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add aarch64-apple-darwin || true

      - name: Reclaim disk before the gate
        # The runner hosts several projects on a small disk. Old target trees
        # and Cargo downloads are reproducible; source and caches we need are
        # untouched.
        run: |
          df -h
          rm -rf "$GITHUB_WORKSPACE/target" "$HOME/.cargo/registry/cache" "$HOME/.cargo/git"
          df -h

      - name: Decide tree-hash reuse
        id: reuse
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          reuse=$(python3 tools/repoctl.py --root . ci tree-reuse)
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
      - name: Run the verification gate on the matrix interpreter
        # The adopted copy (kit-ci.yml) runs only `repoctl check`; docs/adopt.md says why.
        if: steps.reuse.outputs.reuse != 'true'
        env:
          REPOCTL_SETUP: "1"  # runs each surface's declared setup (toolchain install) before its verification
        run: python3 tools/repoctl.py --root . ci gate
      - name: Reuse a verified tree
        if: steps.reuse.outputs.reuse == 'true'
        run: echo "Tree already verified by a successful ci run; heavy verification skipped."

      - name: Reclaim build space
        if: always()
        # The self-hosted runner has a small disk; a debug workspace plus the
        # registry cache is several GB per matrix job.
        run: |
          rm -rf "$GITHUB_WORKSPACE/target"
          rm -rf "$HOME/.cargo/registry/cache" "$HOME/.cargo/git"
  test-future:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: tests 800 days ahead (no calendar rot)
    runs-on: [self-hosted, linux, arm64]
    permissions:
      contents: read
      actions: read  # gh run list/view for tree-hash reuse
    timeout-minutes: 30
    steps:
      - name: Check out pinned revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Decide tree-hash reuse
        id: reuse
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          reuse=$(python3 tools/repoctl.py --root . ci tree-reuse)
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
      - name: Run the tests 800 days ahead
        if: steps.reuse.outputs.reuse != 'true'
        run: KIT_SLOW=1 make test-future
      - name: Reuse a verified tree
        if: steps.reuse.outputs.reuse == 'true'
        run: echo "Tree already verified by a successful ci run; calendar test skipped."
