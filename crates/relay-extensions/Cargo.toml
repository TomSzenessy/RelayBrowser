[package]
name = "relay-extensions"
description = "Chrome migration (bookmarks, history, extensions, passwords), CRX/WKWebExtension loading, Chrome API shims, and the local profile store."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
relay-bridge.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
zip.workspace = true
csv = "1.4"
zeroize.workspace = true
ureq = { version = "3.5", default-features = false, features = ["native-tls", "gzip"] }

[features]
default = ["bundled-sqlite"]
test-support = []
bundled-sqlite = ["rusqlite/bundled"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2 = "0.6"
objc2-foundation.workspace = true
objc2-web-kit.workspace = true
objc2-app-kit = { workspace = true, features = ["NSBitmapImageRep", "NSImageRep"] }
objc2-core-foundation = "0.3"
security-framework = "3.7"
security-framework-sys = "2.17"
